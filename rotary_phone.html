<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>昭和レトロ 黒電話シミュレーター</title>
  <style>
    * { box-sizing: border-box; }
    body { background:#121212; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; font-family: sans-serif; touch-action:none; overflow:hidden; color:#fff; }
    #phone-case { position:relative; width:360px; height:620px; max-width:100vw; background:linear-gradient(145deg,#1a1a1a,#000); border-radius:60px 60px 40px 40px; box-shadow:0 30px 60px #000; display:flex; flex-direction:column; align-items:center; padding-top:40px; }
    #display-window { width:85%; height:65px; background:#000; border:2px solid #222; border-radius:8px; margin-bottom:40px; display:flex; align-items:center; justify-content:flex-end; padding:0 20px; color:#fff; font: bold 34px 'Courier New',monospace; box-shadow:inset 0 5px 15px #000; letter-spacing:3px; }
    .dial-container { position:relative; width:320px; height:320px; max-width:90vw; max-height:90vw; }
    #number-plate,#rotary-disk-group { position:absolute; width:100%; height:100%; border-radius:50%; }
    #number-plate { background:#050505; z-index:1; }
    .number-label { position:absolute; width:60px; height:60px; display:flex; justify-content:center; align-items:center; color:#fff; font-size:34px; font-weight:900; transform:translate(-50%,-50%); }
    #rotary-disk-group { z-index:10; cursor:pointer; touch-action:none; }
    #stopper { position:absolute; width:14px; height:52px; background:linear-gradient(to right,#111,#999,#111); border-radius:4px; z-index:25; left:calc(50% + 92px); top:calc(50% + 78px); transform:translate(-50%,-50%) rotate(-40deg); }
    .center-label-wrapper { width:114px; height:114px; display:flex; justify-content:center; align-items:center; position:relative; }
    .number-card { width:94px; height:94px; background:#e8e4d8; border-radius:50%; border:1px solid #ccc; color:#333; display:flex; flex-direction:column; justify-content:center; align-items:center; box-shadow:inset 0 2px 5px #0003; }
    .card-line { width:80%; height:1px; background:#0002; margin:5px 0; }
    .card-text { font-size:10px; color:#666; font-weight:bold; letter-spacing:1px; }
    .glass-shine { position:absolute; width:100%; height:100%; background:linear-gradient(135deg,#fff3,transparent 50%,#fff1); border-radius:50%; pointer-events:none; }
    #reset-button,#sound-button { border:1px solid #333; border-radius:999px; padding:10px 18px; font-weight:bold; }
    #reset-button { margin-top:35px; background:#111; color:#aaa; }
    #sound-button { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:9999; background:#f5f5f5; color:#111; border:0; padding:13px 20px; box-shadow:0 8px 20px #0008; white-space:nowrap; }
    #audio-status { position:fixed; bottom:66px; left:50%; transform:translateX(-50%); color:#ddd; background:#222; padding:6px 10px; border-radius:8px; font-size:13px; z-index:9998; display:none; }
  </style>
</head>
<body>
  <div id="phone-case">
    <div id="display-window" aria-live="polite"></div>
    <div class="dial-container">
      <div id="number-plate"></div>
      <div id="rotary-disk-group">
        <svg viewBox="0 0 320 320" style="width:100%;height:100%;overflow:visible">
          <defs><mask id="hole-mask"><rect width="320" height="320" fill="white"/><circle cx="160" cy="160" r="57" fill="black"/><g id="holes-group"></g></mask></defs>
          <circle cx="160" cy="160" r="160" fill="#1a1a1a" mask="url(#hole-mask)"/>
          <g id="rims-layer" mask="url(#hole-mask)"><circle cx="160" cy="160" r="159.5" fill="none" stroke="#ffffff0d"/></g>
          <foreignObject x="103" y="103" width="114" height="114"><div xmlns="http://www.w3.org/1999/xhtml" class="center-label-wrapper"><div class="number-card"><div class="card-text">TEL</div><div class="card-line"></div><div class="card-text" style="font-size:13px;color:#333">(03) - 1234</div><div class="card-line"></div></div><div class="glass-shine"></div></div></foreignObject>
          <circle cx="160" cy="160" r="57" fill="none" stroke="#111" stroke-width="3"/>
        </svg>
      </div>
      <div id="stopper"></div>
    </div>
    <button id="reset-button" type="button">Reset</button>
  </div>
  <div id="audio-status" role="status"></div>
  <button id="sound-button" type="button">音を有効化してテスト音を鳴らす</button>
<script>
  const diskGroup=document.getElementById('rotary-disk-group');
  const plate=document.getElementById('number-plate');
  const holesGroup=document.getElementById('holes-group');
  const rimsLayer=document.getElementById('rims-layer');
  const display=document.getElementById('display-window');
  const soundButton=document.getElementById('sound-button');
  const audioStatus=document.getElementById('audio-status');
  const CENTER=160, HOLE_RADIUS=112, HOLE_SIZE=26, START_ANGLE=-30, STEP=-30, STOP_ANGLE=18;
  let currentRotation=0, isDragging=false, activeHoleIdx=-1, isReturning=false, lastPointerAngle=0, totalDelta=0, audioCtx=null;

  function getAudioContext(){
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) throw new Error('このブラウザーは Web Audio API に対応していません');
    if(!audioCtx) audioCtx=new Ctx();
    return audioCtx;
  }
  function enableAudioAndTest(){
    try {
      const ctx=getAudioContext();
      const resume=ctx.state==='suspended' ? ctx.resume() : Promise.resolve();
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type='sine';
      osc.frequency.setValueAtTime(880,ctx.currentTime);
      gain.gain.setValueAtTime(0.0001,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.18,ctx.currentTime+0.015);
      gain.gain.setValueAtTime(0.18,ctx.currentTime+0.18);
      gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.28);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime+0.30);
      resume.then(()=>{ audioStatus.textContent='音声を有効化しました。テスト音が聞こえたらダイヤルを回してください。'; audioStatus.style.display='block'; })
        .catch(err=>{ audioStatus.textContent='音声を開始できません: '+err.message; audioStatus.style.display='block'; });
    } catch(err){ audioStatus.textContent='音声を開始できません: '+err.message; audioStatus.style.display='block'; }
  }
  function playTick(){
    if(!audioCtx) return;
    const ctx=audioCtx;
    const play=()=>{
      if(ctx.state!=='running') return;
      const osc=ctx.createOscillator(), gain=ctx.createGain(), now=ctx.currentTime;
      osc.type='triangle';
      osc.frequency.setValueAtTime(700,now);
      osc.frequency.exponentialRampToValueAtTime(180,now+0.07);
      gain.gain.setValueAtTime(0.0001,now);
      gain.gain.exponentialRampToValueAtTime(0.22,now+0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+0.09);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now+0.1);
    };
    if(ctx.state==='running') play();
    else ctx.resume().then(play).catch(()=>{});
  }
  function init(){
    [1,2,3,4,5,6,7,8,9,0].forEach((num,i)=>{
      const angle=START_ANGLE+i*STEP, rad=angle*Math.PI/180;
      const x=CENTER+HOLE_RADIUS*Math.cos(rad), y=CENTER+HOLE_RADIUS*Math.sin(rad);
      const label=document.createElement('div'); label.className='number-label'; label.textContent=num; label.style.left=x+'px'; label.style.top=y+'px'; plate.appendChild(label);
      const hole=document.createElementNS('http://www.w3.org/2000/svg','circle'); hole.setAttribute('cx',x); hole.setAttribute('cy',y); hole.setAttribute('r',HOLE_SIZE); hole.setAttribute('fill','black'); holesGroup.appendChild(hole);
      const rim=document.createElementNS('http://www.w3.org/2000/svg','circle'); rim.setAttribute('cx',x); rim.setAttribute('cy',y); rim.setAttribute('r',HOLE_SIZE+0.5); rim.setAttribute('fill','none'); rim.setAttribute('stroke','rgba(255,255,255,0.12)'); rim.setAttribute('stroke-width','0.8'); rimsLayer.appendChild(rim);
    }); updateVisuals();
  }
  function updateVisuals(){diskGroup.style.transform=`rotate(${currentRotation}deg)`;}
  function getAngle(e){const r=diskGroup.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI;}
  function handleStart(e){
    if(isReturning) return;
    const angle=getAngle(e); activeHoleIdx=-1;
    for(let i=0;i<10;i++){
      let diff=angle-(START_ANGLE+i*STEP+currentRotation);
      while(diff>180)diff-=360; while(diff< -180)diff+=360;
      if(Math.abs(diff)<22){activeHoleIdx=i;lastPointerAngle=angle;totalDelta=0;isDragging=true;diskGroup.setPointerCapture?.(e.pointerId);break;}
    }
  }
  function handleMove(e){
    if(!isDragging||isReturning)return;
    const angle=getAngle(e);let delta=angle-lastPointerAngle;
    while(delta>180)delta-=360;while(delta< -180)delta+=360;
    totalDelta+=delta;lastPointerAngle=angle;
    if(totalDelta>0){const holeStart=START_ANGLE+activeHoleIdx*STEP;currentRotation=Math.min(totalDelta,STOP_ANGLE-holeStart);}else currentRotation=0;
    updateVisuals();
  }
  function handleEnd(){
    if(!isDragging)return;isDragging=false;
    const holeStart=START_ANGLE+activeHoleIdx*STEP, maxRot=STOP_ANGLE-holeStart;
    startReturnProcess(maxRot-currentRotation<10?activeHoleIdx+1:-1);
  }
  function startReturnProcess(digit){
    isReturning=true;const startRot=currentRotation,startTime=performance.now(),duration=Math.max(150,startRot*3.5);let lastTickStep=0;
    function animate(now){
      const progress=Math.min((now-startTime)/duration,1);currentRotation=startRot*(1-progress);updateVisuals();
      if(digit!==-1){const tick=Math.floor((startRot-currentRotation)/30);if(tick>lastTickStep){playTick();lastTickStep=tick;}}
      if(progress<1)requestAnimationFrame(animate);else{isReturning=false;if(digit!==-1){display.textContent+=(digit===10?0:digit);playTick();}currentRotation=0;updateVisuals();}
    } requestAnimationFrame(animate);
  }
  soundButton.addEventListener('click',enableAudioAndTest);
  document.getElementById('reset-button').addEventListener('click',()=>{display.textContent='';});
  diskGroup.addEventListener('pointerdown',handleStart);
  window.addEventListener('pointermove',handleMove);
  window.addEventListener('pointerup',handleEnd);
  window.addEventListener('pointercancel',handleEnd);
  init();
</script>
</body>
</html>
